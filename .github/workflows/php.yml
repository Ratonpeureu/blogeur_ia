name: PHP Composer (Laravel)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'blogeur_ia_laravel/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'blogeur_ia_laravel/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blogeur_ia_laravel  

    steps:
    - uses: actions/checkout@v4

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: blogeur_ia_laravel/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('blogeur_ia_laravel/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
