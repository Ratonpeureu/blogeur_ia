name: PHP Composer (Laravel)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'blogeur_ia_laravel/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'blogeur_ia_laravel/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blogeur_ia_laravel   # toutes les commandes s'exécutent ici

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer:v2
        extensions: mbstring, intl, json, xml, curl, pdo, pdo_mysql  # ajustez selon vos besoins

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: blogeur_ia_laravel/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('blogeur_ia_laravel/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    # - name: Run test suite
    #   run: composer run-script test
