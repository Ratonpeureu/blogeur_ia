name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'blogeur_ia_node/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'blogeur_ia_node/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    defaults:
      run:
        working-directory: blogeur_ia_node

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build   
